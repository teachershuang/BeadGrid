name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri NSIS package
        run: npm run tauri:build

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $setup) {
            throw 'NSIS installer not found.'
          }

          $portableExe = 'src-tauri/target/release/BeadGrid.exe'
          if (-not (Test-Path $portableExe)) {
            throw 'Portable executable not found at src-tauri/target/release/BeadGrid.exe.'
          }

          Copy-Item $setup.FullName 'release-assets/BeadGrid-Setup-x64.exe' -Force
          Compress-Archive -Path $portableExe -DestinationPath 'release-assets/BeadGrid-Portable-x64.zip' -Force

          $setupHash = (Get-FileHash 'release-assets/BeadGrid-Setup-x64.exe' -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash 'release-assets/BeadGrid-Portable-x64.zip' -Algorithm SHA256).Hash

          @(
            "$setupHash  BeadGrid-Setup-x64.exe"
            "$portableHash  BeadGrid-Portable-x64.zip"
          ) | Set-Content 'release-assets/SHA256SUMS.txt' -Encoding utf8

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @(
            'BeadGrid Windows release'
            ''
            'Assets:'
            '- BeadGrid-Setup-x64.exe: installer'
            '- BeadGrid-Portable-x64.zip: portable build'
            '- SHA256SUMS.txt: checksums'
          ) -join "`n"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              "release-assets/BeadGrid-Setup-x64.exe" `
              "release-assets/BeadGrid-Portable-x64.zip" `
              "release-assets/SHA256SUMS.txt" `
              --title $tag `
              --notes $notes
          } else {
            gh release upload $tag `
              "release-assets/BeadGrid-Setup-x64.exe" `
              "release-assets/BeadGrid-Portable-x64.zip" `
              "release-assets/SHA256SUMS.txt" `
              --clobber
          }
